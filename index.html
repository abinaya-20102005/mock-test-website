<!DOCTYPE html>
<html>
<head>
<title>Mock Test Platform</title>
<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.card{
background:white;
padding:40px;
width:350px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
text-align:center;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
}
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
background:#111;
color:white;
cursor:pointer;
}
.create{
background:transparent;
color:#555;
border:1px solid #ccc;
}
</style>
</head>
<body>
<div class="card">
<h2>Mock Test</h2>
<p>Prepare Smart. Perform Better.</p>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button>Login</button>
<button class="create">Create Account</button>
</div>
</body>
</html>
