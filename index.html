<!DOCTYPE html>
<html>
<head>
<title>Mock Test</title>
<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(to right,#e0f7fa,#fce4ec);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.card{
background:white;
padding:40px;
width:350px;
border-radius:15px;
text-align:center;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}
button{
width:100%;
padding:12px;
margin-top:10px;
background:#7c4dff;
color:white;
border:none;
border-radius:10px;
}
.create{
background:#f8bbd0;
color:black;
}
</style>
</head>
<body>
<div class="card">
<h2>Welcome Student</h2>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button>Login</button>
<button class="create">Create Account</button>
</div>
</body>
</html>
