<!DOCTYPE html>
<html>
<head>
<title>Mock Test</title>
<style>
body{
margin:0;
background:#0f172a;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}
.box{
background:#1e293b;
padding:40px;
width:350px;
border-radius:10px;

}
input{
width:100%;
padding:12px;

}
button{
width:100%;
padding:12px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
}
.create{
background:transparent;
border:1px solid #2563eb;
color:#2563eb;
}
</style>
</head>
<body>
<div class="box">
<h2>Mock Test Platform</h2>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button>Login</button>
<button class="create">Create Account</button>
</div>
</body>
</html>
